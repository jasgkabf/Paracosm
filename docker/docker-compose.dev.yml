version: "3.9"

services:
  paracosm-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: deps
    container_name: paracosm-dev
    ports:
      - "7529:7529"
    volumes:
      - ..:/app
      - /app/node_modules
      - /app/packages/shared/node_modules
    environment:
      - NODE_ENV=development
      - PORT=7529
      - LOG_LEVEL=debug
    command: ["pnpm", "run", "dev"]
    stdin_open: true
    tty: true
