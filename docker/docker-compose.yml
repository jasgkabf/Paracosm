version: "3.9"

services:
  paracosm:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: paracosm
    restart: unless-stopped
    ports:
      - "7529:7529"
    environment:
      - NODE_ENV=production
      - PORT=7529
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7529/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
