version: "3.9"

services:
  paracosm:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: paracosm
    restart: unless-stopped
    ports:
      - "7529:7529"
    environment:
      - NODE_ENV=production
      - PORT=7529
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7529/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
